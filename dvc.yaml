stages:
  data_ingestion:
    cmd: python src/CustomerRiskPrediction/pipeline/stage_01_data_ingestion.py
    deps:
      - src/CustomerRiskPrediction/pipeline/stage_01_data_ingestion.py
      - src/CustomerRiskPrediction/components/data_ingestion.py
      - config/config.yaml
    outs:
      - artifacts/data_ingestion/data.csv

  data_transformation:
    cmd: python src/CustomerRiskPrediction/pipeline/stage_02_data_transformation.py
    deps:
      - src/CustomerRiskPrediction/pipeline/stage_02_data_transformation.py
      - src/CustomerRiskPrediction/components/data_transformation.py
      - src/woe_iv.py
      - config/config.yaml
      - artifacts/data_ingestion/data.csv
    outs:
      - artifacts/data_transformation/train.csv
      - artifacts/data_transformation/val.csv
      - artifacts/data_transformation/test.csv
      - artifacts/data_transformation/woe_rules.csv

  model_trainer:
    cmd: python src/CustomerRiskPrediction/pipeline/stage_03_model_trainer.py
    deps:
      - src/CustomerRiskPrediction/pipeline/stage_03_model_trainer.py
      - src/CustomerRiskPrediction/components/model_trainer.py
      - config/config.yaml
      - artifacts/data_transformation/train.csv
    params:
      - LogisticRegression.max_iter
      - LogisticRegression.random_state
      - LogisticRegression.solver
    outs:
      - artifacts/model_trainer/model.joblib
