version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: credit_risk_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Batman@2003
      POSTGRES_DB: credit_risk
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: credit_risk_web
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_USER=postgres
      - DB_PASSWORD=Batman@2003
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=credit_risk
    volumes:
      - ./artifacts:/app/artifacts
      - ./logs:/app/logs

volumes:
  postgres_data:
